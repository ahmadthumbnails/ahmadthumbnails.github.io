<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmad - YouTube Thumbnail Designer</title>
<meta name="description" content="YouTube thumbnail design for creators. Browse recent work and get a quote on Instagram.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="wrap top">
  <a class="brand" href="#top" id="brandName"></a>
  <nav aria-label="Main">
    <a href="#work">Work</a>
    <a href="#faq">FAQ</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="top">
  <div class="wrap hero">
    <h1 id="headline"></h1>
    <p id="intro"></p>
    <div class="actions">
      <a class="btn btn-primary" href="#work">See the work</a>
      <a class="btn btn-ghost" href="#contact">Get a quote</a>
    </div>
  </div>

  <section id="work">
    <div class="wrap">
      <h2>Recent work</h2>
      <p class="lede">Select a thumbnail to see it larger.</p>
      <div class="filters" id="filters" role="group" aria-label="Filter by tag"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="faq">
    <div class="wrap">
      <h2>Questions</h2>
      <div class="faq" id="faqList"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap contact">
      <div>
        <h2>Get a quote</h2>
        <p class="lede" id="contactIntro"></p>
        <div class="direct">
          <a id="igLink" href="#" target="_blank" rel="noopener"></a>
        </div>
      </div>

      <div>
        <form id="form">
          <div>
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </div>
          <div>
            <label for="channel">Channel link <span class="opt">(optional)</span></label>
            <input type="text" id="channel" name="channel" placeholder="youtube.com/@yourchannel" autocomplete="off">
          </div>
          <div>
            <label for="need">What do you need?</label>
            <textarea id="need" name="need" placeholder="For example: 4 thumbnails a month for gaming videos" required></textarea>
          </div>
          <div><button class="btn btn-primary" type="submit">Write my message</button></div>
        </form>

        <div class="result" id="result">
          <label for="msg">Your message</label>
          <textarea id="msg" readonly></textarea>
          <div class="row">
            <button class="btn btn-primary" type="button" id="copyBtn">Copy message</button>
            <a class="btn btn-ghost" id="openBtn" href="#" target="_blank" rel="noopener">Open Instagram</a>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="copyright"></span>
    <a id="igFoot" href="#" target="_blank" rel="noopener"></a>
  </div>
</footer>

<dialog id="lightbox" aria-label="Thumbnail preview">
  <div class="lb">
    <div class="thumb" id="lbMedia"></div>
    <div class="lb-bar">
      <p><strong id="lbTitle"></strong><br><small id="lbTags"></small></p>
      <div class="row">
        <a class="btn btn-ghost" id="lbLink" href="#" target="_blank" rel="noopener" hidden>Watch video</a>
        <button class="btn btn-ghost" type="button" id="lbClose">Close</button>
      </div>
    </div>
  </div>
</dialog>

<!-- Data first, then the code that reads it. -->
<script src="data/config.js"></script>
<script src="data/thumbnails.js"></script>
<script src="js/main.js"></script>
</body>
</html>
